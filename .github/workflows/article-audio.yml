# Records the "Listen" narration for published articles.
#
# Uses Kokoro, a free, open-source voice model, with the "Bella" voice.
# No accounts, keys or secrets: it reads the public site (sitemap + article
# pages), records only articles that are new or changed, and commits the MP3s
# to public/audio/ plus a manifest the article page reads. Vercel redeploys
# on that commit and the Listen button appears.
#
# Runs on every push to main (so merging starts it), every 30 minutes (to pick
# up articles published in the CMS), and by hand from the Actions tab.
name: Article audio

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/audio/**"
      - "src/lib/content/article-audio.json"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-record every article (e.g. after changing the voice)"
        type: boolean
        default: false

concurrency:
  group: article-audio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MODEL_RELEASE: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
    steps:
      - uses: actions/checkout@v4

      # A push to main also redeploys the site; give Vercel a head start so
      # the pages read below are the current ones.
      - name: Wait for deploy
        if: github.event_name == 'push'
        run: sleep 150

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/audio/requirements.txt

      - run: pip install -r scripts/audio/requirements.txt

      - name: Cache voice model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL -o models/kokoro-v1.0.onnx "$MODEL_RELEASE/kokoro-v1.0.onnx"
          curl -fsSL -o models/voices-v1.0.bin "$MODEL_RELEASE/voices-v1.0.bin"

      - name: Record new and updated articles
        env:
          KOKORO_MODEL: models/kokoro-v1.0.onnx
          KOKORO_VOICES: models/voices-v1.0.bin
          AUDIO_VOICE: af_bella
          AUDIO_SPEED: "1.0"
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python scripts/audio/generate_article_audio.py

      - name: Commit recordings
        if: always()
        run: |
          git add public/audio src/lib/content/article-audio.json
          if git diff --cached --quiet; then
            echo "No new recordings."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Article audio: update recordings"
          git pull --rebase origin main
          git push
