# Records the "Listen" narration for published articles.
#
# Uses Kokoro, a free, open-source voice model, with the "Bella" voice. Runs
# every 30 minutes and records only articles that are new or have changed
# since their last recording, so most runs finish in under a minute.
# Run it by hand from the Actions tab ("Run workflow") after publishing if you
# don't want to wait, or with "force" to re-record everything.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                the same value as NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY   the service-role key from Supabase
name: Article audio

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-record every article (e.g. after changing the voice)"
        type: boolean
        default: false

concurrency:
  group: article-audio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODEL_RELEASE: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/audio/requirements.txt

      - run: pip install -r scripts/audio/requirements.txt

      - name: Cache voice model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL -o models/kokoro-v1.0.onnx "$MODEL_RELEASE/kokoro-v1.0.onnx"
          curl -fsSL -o models/voices-v1.0.bin "$MODEL_RELEASE/voices-v1.0.bin"

      - name: Record new and updated articles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KOKORO_MODEL: models/kokoro-v1.0.onnx
          KOKORO_VOICES: models/voices-v1.0.bin
          AUDIO_VOICE: af_bella
          AUDIO_SPEED: "1.0"
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python scripts/audio/generate_article_audio.py
